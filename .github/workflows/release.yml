name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "0"
  TAGS: with_quic with_utls with_wireguard with_acme

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, name: linux-64 }
          - { goos: linux, goarch: arm64, name: linux-arm64-v8a }
          - { goos: linux, goarch: arm, goarm: "7", name: linux-arm32-v7a }
          - { goos: darwin, goarch: amd64, name: macos-64 }
          - { goos: darwin, goarch: arm64, name: macos-arm64-v8a }
          - { goos: windows, goarch: amd64, name: windows-64 }
          - { goos: windows, goarch: arm64, name: windows-arm64-v8a }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go build
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ldflags="-X main.version=$VERSION -X main.buildTime=$built -s -w -buildid="
          ext=""
          if [ "$GOOS" = windows ]; then ext=.exe; fi
          go build -trimpath -tags "$TAGS" -ldflags "$ldflags" -o "out/xnode$ext" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.name }}
          path: out/
          if-no-files-found: error
          retention-days: 1

  package:
    name: Package
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          path: bin
      - name: Package
        run: |
          epoch=$(git log -1 --format=%ct)
          mkdir dist
          for dir in bin/bin-*; do
            name=${dir#bin/bin-}
            stage="stage/$name"
            mkdir -p "$stage"
            cp "$dir"/xnode* README.md example/config.yml.example "$stage"/
            if [ -f "$stage/xnode" ]; then chmod 755 "$stage/xnode"; fi
            find "$stage" -exec touch -d "@$epoch" {} +
            (cd "$stage" && zip -9qX "$GITHUB_WORKSPACE/dist/xnode-$name.zip" ./*)
          done
          cd dist
          sha256sum xnode-*.zip > sha256sums.txt
          cat sha256sums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
          fi
